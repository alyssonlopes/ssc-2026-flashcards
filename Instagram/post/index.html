:root{--bg:#fff;--ink:#000;--muted:#737373;--line:#dbdbdb;--soft:#fafafa;--blue:#0095f6;--accent:#0f766e;--accent2:#134e4a}@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f5;--muted:#aaa;--line:#262626;--soft:#101010}}*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;background:var(--bg)}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.bar{height:55px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px)}.bar-inner{width:min(620px,100%);height:100%;margin:auto;padding:0 14px;display:flex;align-items:center;gap:14px}.back{font-size:28px}.bar-title{font-weight:700;flex:1}.shell{width:min(620px,100%);margin:0 auto;padding:18px 0 70px}.post{border:1px solid var(--line);border-radius:10px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px}.avatar{width:42px;height:42px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}.avatar img{width:100%;height:100%;display:block;border-radius:50%;border:2px solid var(--bg)}.user{flex:1}.user b{display:block;font-size:14px}.user span{font-size:12px;color:var(--muted)}.more{border:0;background:none;font-size:21px;padding:8px}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1}.carousel::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;padding:30px;display:flex;flex-direction:column}.cover{color:#fff;justify-content:space-between;background:linear-gradient(145deg,var(--accent),var(--accent2))}.cover small{font-weight:800;text-transform:uppercase;letter-spacing:.08em}.cover h1{font-size:clamp(30px,7vw,46px);line-height:1.03;margin:0}.answer{background:var(--bg);overflow:auto}.answer small{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.answer-body{font-size:clamp(17px,4vw,22px);line-height:1.42;margin-top:18px}.answer-meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto;padding-top:18px}.dots{text-align:center;padding:8px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin:0 2px}.dot.active{background:var(--blue)}.actions{padding:10px 14px;display:flex;gap:12px}.action{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:9px;font-weight:600;cursor:pointer}.sources{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:18px}.sources h2{font-size:17px;margin:0 0 6px}.sources p{font-size:13px;color:var(--muted);line-height:1.45}.source{display:block;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.source b{display:block}.source span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.menu-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px}.menu-bg.open{display:flex}.menu{width:min(420px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}.mi{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 18px;font-size:14px;cursor:pointer}.mi.primary{color:var(--blue);font-weight:700}.mi.cancel{text-align:center;font-weight:700}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262626;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;opacity:0;transition:.2s;z-index:110}.toast.show{opacity:1}.error{text-align:center;padding:80px 20px}.error a{color:var(--blue);font-weight:700}@media(max-width:650px){.shell{padding:0 0 55px}.post,.sources{border-left:0;border-right:0;border-radius:0}.sources{margin-top:10px}.menu-bg{align-items:flex-end;padding:0}.menu{width:100%;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style></head><body><header class="bar"><div class="bar-inner"><a class="back" href="../">‹</a><div class="bar-title">Publicação</div></div></header><main class="shell" id="shell"><div id="loading" class="error">Carregando publicação…</div></main><div class="menu-bg" id="menuBg"><section class="menu" id="menu"></section></div><div class="toast" id="toast"></div><script>
const PROFILES={"Rastreio e manejo inicial":{"username":"rastreio.sepse","name":"Rastreio & Manejo Inicial","accent":"#f59e0b","accent2":"#ef4444","icon":"◎"},"Infecção e antimicrobianos":{"username":"antimicrobianos.sepse","name":"Antimicrobianos","accent":"#8b5cf6","accent2":"#ec4899","icon":"◫"},"Hemodinâmica":{"username":"hemodinamica.sepse","name":"Hemodinâmica","accent":"#ef4444","accent2":"#f97316","icon":"♥"},"Suporte respiratório":{"username":"respiratorio.sepse","name":"Suporte Respiratório","accent":"#06b6d4","accent2":"#3b82f6","icon":"♧"},"Terapias adjuvantes":{"username":"adjuvantes.sepse","name":"Terapias Adjuvantes","accent":"#10b981","accent2":"#14b8a6","icon":"✚"},"Objetivos de cuidado":{"username":"objetivos.sepse","name":"Objetivos de Cuidado","accent":"#6366f1","accent2":"#8b5cf6","icon":"◇"},"Transições de cuidado":{"username":"transicoes.sepse","name":"Transições de Cuidado","accent":"#f43f5e","accent2":"#a855f7","icon":"↔"},"Recuperação":{"username":"recuperacao.sepse","name":"Recuperação Pós-Sepse","accent":"#22c55e","accent2":"#eab308","icon":"☀"}},SOURCE_CCM='https://doi.org/10.1097/CCM.0000000000007075',SOURCE_ICM='https://doi.org/10.1007/s00134-026-08361-1',$=id=>document.getElementById(id);let CARD=null,PROFILE=null;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function rich(s=''){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function plain(s=''){return String(s||'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim()}function profileHref(){return `../${encodeURIComponent(PROFILE.username)}`}function avatar(p){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g"><stop stop-color="${p.accent}"/><stop offset="1" stop-color="${p.accent2}"/></linearGradient></defs><circle cx="64" cy="64" r="64" fill="url(#g)"/><text x="64" y="79" text-anchor="middle" font-size="58" fill="white" font-family="Arial">${p.icon}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function meta(c){return [c.f&&`<b>Força/certeza:</b> ${rich(c.f)}`,c.y&&`<b>Tipo:</b> ${rich(c.y)}`,c.o&&`<b>Observação:</b> ${rich(c.o)}`].filter(Boolean).join('<br><br>')}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1700)}function render(){document.documentElement.style.setProperty('--accent',PROFILE.accent);document.documentElement.style.setProperty('--accent2',PROFILE.accent2);document.title=`Recomendação ${CARD.id} — ${PROFILE.username}`;$('shell').innerHTML=`<article class="post"><div class="post-head"><a class="avatar" href="${profileHref()}"><img src="${avatar(PROFILE)}" alt="${esc(PROFILE.name)}"></a><div class="user"><a href="${profileHref()}"><b>${esc(PROFILE.username)}</b></a><span>${esc(PROFILE.name)} · recomendação ${CARD.id}/129</span></div><button class="more" id="more">•••</button></div><div class="carousel" id="carousel"><section class="slide cover"><small>${esc(PROFILE.name)} · recomendação ${CARD.id}</small><h1>${esc(CARD.t)}</h1><small>PDF · p. ${CARD.p} · deslize →</small></section><section class="slide answer"><small>Recomendação ${CARD.id}</small><div class="answer-body">${rich(CARD.a)}</div><div class="answer-meta">${meta(CARD)}</div></section></div><div class="dots"><span class="dot active"></span><span class="dot"></span></div><div class="actions"><button class="action" id="share">Compartilhar</button><button class="action" id="download">Baixar</button></div></article><section class="sources" id="sources"><h2>Referências e fonte</h2><p>Conteúdo educacional baseado na Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2026. Nesta tradução, esta recomendação corresponde à página ${CARD.p} do PDF utilizado.</p><a class="source" href="${SOURCE_CCM}" target="_blank" rel="noopener"><b>Critical Care Medicine</b><span>DOI 10.1097/CCM.0000000000007075</span></a><a class="source" href="${SOURCE_ICM}" target="_blank" rel="noopener"><b>Intensive Care Medicine</b><span>DOI 10.1007/s00134-026-08361-1</span></a></section>`;$('more').onclick=openMenu;$('download').onclick=openMenu;$('share').onclick=share;const car=$('carousel'),dots=[...document.querySelectorAll('.dot')];car.onscroll=()=>requestAnimationFrame(()=>{const i=Math.round(car.scrollLeft/Math.max(1,car.clientWidth));dots.forEach((d,j)=>d.classList.toggle('active',i===j))})}function openMenu(){$('menu').innerHTML=`<button class="mi primary" data-a="profile">Abrir perfil de ${esc(PROFILE.username)}</button><button class="mi" data-a="copy">Copiar link desta publicação</button><button class="mi" data-a="image">Baixar as 2 imagens · PNG</button><button class="mi" data-a="pdf">Baixar PDF · 2 páginas</button><a class="mi" style="display:block" href="${SOURCE_CCM}" target="_blank" rel="noopener">Fonte · Critical Care Medicine</a><a class="mi" style="display:block" href="${SOURCE_ICM}" target="_blank" rel="noopener">Fonte · Intensive Care Medicine</a><button class="mi cancel" data-a="cancel">Cancelar</button>`;$('menuBg').classList.add('open');$('menu').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a==='profile')location.href=profileHref();if(a==='copy'){await navigator.clipboard.writeText(location.href);toast('Link copiado');closeMenu()}if(a==='image'){closeMenu();await downloadImage()}if(a==='pdf'){closeMenu();await downloadPdf()}if(a==='cancel')closeMenu()})}function closeMenu(){$('menuBg').classList.remove('open')}function wrapCanvas(ctx,text,maxWidth){const out=[];for(const para of String(text||'').split(/\n+/)){const words=para.trim().split(/\s+/).filter(Boolean);let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=w}else line=test}if(line)out.push(line)}return out}function fitCanvas(ctx,text,maxWidth,maxHeight,start=50,min=22){for(let size=start;size>=min;size-=2){ctx.font=`500 ${size}px Arial`;const lines=wrapCanvas(ctx,text,maxWidth),lh=size*1.3;if(lines.length*lh<=maxHeight)return{size,lines,lh}}ctx.font=`500 ${min}px Arial`;return{size:min,lines:wrapCanvas(ctx,text,maxWidth),lh:min*1.25}}function drawLines(ctx,o,x,y,max=999){o.lines.slice(0,max).forEach((line,i)=>ctx.fillText(line,x,y+i*o.lh))}function slides(){const W=1080,H=1080,a=document.createElement('canvas'),b=document.createElement('canvas');a.width=b.width=W;a.height=b.height=H;let x=a.getContext('2d'),g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,PROFILE.accent);g.addColorStop(1,PROFILE.accent2);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(930,120,260,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='700 30px Arial';x.fillText(PROFILE.name.toUpperCase(),70,92);x.font='700 27px Arial';x.fillText(`RECOMENDAÇÃO ${CARD.id} / 129`,70,142);x.textBaseline='top';let t=fitCanvas(x,plain(CARD.t),W-140,610,76,42);x.font=`800 ${t.size}px Arial`;drawLines(x,t,70,260);x.textBaseline='alphabetic';x.font='600 28px Arial';x.fillText(`PDF · página ${CARD.p}`,70,990);let y=b.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,W,H);y.fillStyle='#087cc1';y.font='800 28px Arial';y.fillText(`RECOMENDAÇÃO ${CARD.id} · SSC 2026`,65,78);y.fillStyle='#111';y.textBaseline='top';let q=fitCanvas(y,plain(CARD.a),W-130,690,50,22);y.font=`500 ${q.size}px Arial`;drawLines(y,q,65,135);let top=135+q.lines.length*q.lh+28,extra=[CARD.f&&`Força/certeza: ${plain(CARD.f)}`,CARD.y&&`Tipo: ${plain(CARD.y)}`,CARD.o&&`Observação: ${plain(CARD.o)}`].filter(Boolean).join(' · ');y.fillStyle='#555';let e=fitCanvas(y,extra,W-130,Math.max(90,900-top),24,18);y.font=`500 ${e.size}px Arial`;drawLines(y,e,65,top,8);y.textBaseline='alphabetic';y.fillStyle='#777';y.font='500 20px Arial';y.fillText(`Fonte: Surviving Sepsis Campaign 2026 · PDF p. ${CARD.p}`,65,1015);return[a,b]}function dl(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}async function blob(canvas,type='image/png',q=.95){return new Promise(r=>canvas.toBlob(r,type,q))}async function downloadImage(){toast('Gerando imagem…');const[a,b]=slides(),out=document.createElement('canvas');out.width=1080;out.height=2160;let x=out.getContext('2d');x.drawImage(a,0,0);x.drawImage(b,0,1080);dl(await blob(out),`ssc-2026-recomendacao-${CARD.id}.png`)}function ascii(s){return new TextEncoder().encode(s)}function join(parts){let n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n),p=0;for(const b of parts){o.set(b,p);p+=b.length}return o}function jpg(c){const bin=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o}function makePdf(cs){const im=cs.map(jpg),ob=[];ob.push(ascii('<< /Type /Catalog /Pages 2 0 R >>'));ob.push(ascii('<< /Type /Pages /Kids [3 0 R 6 0 R] /Count 2 >>'));ob.push(ascii('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));ob.push(join([ascii(`<< /Type /XObject /Subtype /Image /Width 1080 /Height 1080 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im[0].length} >>\nstream\n`),im[0],ascii('\nendstream')]));let c1=ascii('q 612 0 0 612 0 0 cm /Im0 Do Q');ob.push(join([ascii(`<< /Length ${c1.length} >>\nstream\n`),c1,ascii('\nendstream')]));ob.push(ascii('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 612] /Resources << /XObject << /Im1 7 0 R >> >> /Contents 8 0 R >>'));ob.push(join([ascii(`<< /Type /XObject /Subtype /Image /Width 1080 /Height 1080 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im[1].length} >>\nstream\n`),im[1],ascii('\nendstream')]));let c2=ascii('q 612 0 0 612 0 0 cm /Im1 Do Q');ob.push(join([ascii(`<< /Length ${c2.length} >>\nstream\n`),c2,ascii('\nendstream')]));let head=ascii('%PDF-1.4\n'),parts=[head],offs=[0],pos=head.length;ob.forEach((o,i)=>{offs.push(pos);let pre=ascii(`${i+1} 0 obj\n`),post=ascii('\nendobj\n');parts.push(pre,o,post);pos+=pre.length+o.length+post.length});let xref=pos,t=`xref\n0 ${ob.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offs.length;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';t+=`trailer\n<< /Size ${ob.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;parts.push(ascii(t));return new Blob([join(parts)],{type:'application/pdf'})}async function downloadPdf(){toast('Gerando PDF…');dl(makePdf(slides()),`ssc-2026-recomendacao-${CARD.id}.pdf`)}async function share(){const text=`${PROFILE.username} — SSC 2026\n${CARD.t}\n\n${plain(CARD.a)}`;try{if(navigator.share)await navigator.share({title:CARD.t,text,url:location.href});else{await navigator.clipboard.writeText(`${text}\n\n${location.href}`);toast('Conteúdo e link copiados')}}catch(e){}}async function init(){const id=new URLSearchParams(location.search).get('id');if(!id)return fail('Publicação não encontrada.');try{const parts=await Promise.all([1,2,3,4,5].map(i=>fetch(`/ssc-2026-flashcards/cards-${i}.json`).then(r=>r.json())));CARD=parts.flat().find(c=>String(c.id)===String(id));if(!CARD)return fail('Publicação não encontrada.');PROFILE=PROFILES[CARD.s];render();const d=new URLSearchParams(location.search).get('download');if(d==='image')setTimeout(downloadImage,250);if(d==='pdf')setTimeout(downloadPdf,250)}catch(e){fail('Não foi possível carregar esta publicação.')}}function fail(m){$('shell').innerHTML=`<div class="error"><h1>${esc(m)}</h1><a href="../">Voltar ao feed</a></div>`}$('menuBg').onclick=e=>{if(e.target===$('menuBg'))closeMenu()};init();
</script><script>
/* studygram-share-image-v1 */

async function studygramCurrentPostShareFile(){
  const pair=slides(), out=document.createElement('canvas');
  out.width=1080; out.height=2160;
  const ctx=out.getContext('2d');
  ctx.drawImage(pair[0],0,0); ctx.drawImage(pair[1],0,1080);
  const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png',.95));
  return new File([blob],`ssc-2026-recomendacao-${CARD.id}.png`,{type:'image/png'});
}
share=async function(){
  if(!CARD||!PROFILE)return;
  const url=location.href, text=`${PROFILE.username} — SSC 2026\n${CARD.t}`;
  try{
    const file=await studygramCurrentPostShareFile();
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:CARD.t,text,url,files:[file]});
      return;
    }
    if(navigator.share){
      await navigator.share({title:CARD.t,text,url});
      return;
    }
    await navigator.clipboard.writeText(`${text}\n\n${url}`);
    toast('Link copiado');
  }catch(e){
    if(e && e.name==='AbortError')return;
    try{
      if(navigator.share){await navigator.share({title:CARD.t,text,url});return}
      await navigator.clipboard.writeText(url);toast('Link copiado');
    }catch(_){}
  }
};

</script><script>
/* studygram-share-image-v2 */

function studygramPostCanvasToPngFileSync(canvas,id){
  const dataUrl=canvas.toDataURL('image/png');
  const b64=dataUrl.slice(dataUrl.indexOf(',')+1);
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new File([bytes],`ssc-2026-recomendacao-${id}.png`,{type:'image/png',lastModified:Date.now()});
}
function studygramBuildCurrentPostShareFileSync(){
  const pair=slides(), out=document.createElement('canvas');
  out.width=1080; out.height=2160;
  const ctx=out.getContext('2d');
  ctx.drawImage(pair[0],0,0); ctx.drawImage(pair[1],0,1080);
  return studygramPostCanvasToPngFileSync(out,CARD.id);
}
function studygramPostDownloadShareFallback(file,url){
  const href=URL.createObjectURL(file), a=document.createElement('a');
  a.href=href; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(href),1500);
  if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
  toast('Este navegador não compartilha imagens direto. PNG baixado; link copiado.');
}
share=function(){
  if(!CARD||!PROFILE)return;
  const url=location.href;
  let file;
  try{file=studygramBuildCurrentPostShareFileSync()}catch(e){
    console.error(e);toast('Não foi possível gerar a imagem');return;
  }
  const canFileShare=!!navigator.share && typeof navigator.canShare==='function' && navigator.canShare({files:[file]});
  if(canFileShare){
    navigator.share({files:[file]}).catch(e=>{
      if(e&&e.name==='AbortError')return;
      console.error(e);studygramPostDownloadShareFallback(file,url);
    });
    return;
  }
  studygramPostDownloadShareFallback(file,url);
};

</script></body></html>
