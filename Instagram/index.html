const PROFILES={"Rastreio e manejo inicial":{"username":"rastreio.sepse","name":"Rastreio & Manejo Inicial","bio":"Reconhecimento precoce, rastreio, lactato, culturas e primeiros passos no manejo da sepse.","accent":"#f59e0b","accent2":"#ef4444","icon":"radar"},"Infecção e antimicrobianos":{"username":"antimicrobianos.sepse","name":"Antimicrobianos","bio":"Antibióticos, controle do foco, descalonamento, resistência e decisões antimicrobianas na sepse.","accent":"#8b5cf6","accent2":"#ec4899","icon":"capsule"},"Hemodinâmica":{"username":"hemodinamica.sepse","name":"Hemodinâmica","bio":"Fluidos, PAM, vasopressores, perfusão e monitorização hemodinâmica no choque séptico.","accent":"#ef4444","accent2":"#f97316","icon":"heart"},"Suporte respiratório":{"username":"respiratorio.sepse","name":"Suporte Respiratório","bio":"Oxigenação, ventilação mecânica, SDRA, prona e estratégias de suporte respiratório.","accent":"#06b6d4","accent2":"#3b82f6","icon":"lungs"},"Terapias adjuvantes":{"username":"adjuvantes.sepse","name":"Terapias Adjuvantes","bio":"Corticoide, transfusão, glicemia, nutrição, profilaxias e outras terapias de suporte.","accent":"#10b981","accent2":"#14b8a6","icon":"iv"},"Objetivos de cuidado":{"username":"objetivos.sepse","name":"Objetivos de Cuidado","bio":"Comunicação, tomada de decisão, metas terapêuticas e integração de cuidados paliativos.","accent":"#6366f1","accent2":"#8b5cf6","icon":"compass"},"Transições de cuidado":{"username":"transicoes.sepse","name":"Transições de Cuidado","bio":"Alta da UTI, reconciliação medicamentosa, comunicação e continuidade do cuidado.","accent":"#f43f5e","accent2":"#a855f7","icon":"bridge"},"Recuperação":{"username":"recuperacao.sepse","name":"Recuperação Pós-Sepse","bio":"Reabilitação, saúde mental, cognição e acompanhamento após a hospitalização por sepse.","accent":"#22c55e","accent2":"#eab308","icon":"sunrise"}},ICONS={"radar":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\"><circle cx=\"64 /* studygram-share-image-v1 */

async function studygramShareImageFile(c,p){
  const pair=exportSlides(c,p), out=document.createElement('canvas');
  out.width=1080; out.height=2160;
  const ctx=out.getContext('2d');
  ctx.drawImage(pair[0],0,0); ctx.drawImage(pair[1],0,1080);
  const blob=await canvasBlob(out,'image/png',.95);
  return new File([blob],`ssc-2026-recomendacao-${c.id}.png`,{type:'image/png'});
}
share=async function(id){
  const c=ALL.find(x=>String(x.id)===String(id));
  if(!c)return;
  const p=profileFor(c), url=postUrl(id), text=`${p.username} — SSC 2026\n${c.t}`;
  try{
    const file=await studygramShareImageFile(c,p);
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:c.t,text,url,files:[file]});
      return;
    }
    if(navigator.share){
      await navigator.share({title:c.t,text,url});
      return;
    }
    await navigator.clipboard.writeText(`${text}\n\n${url}`);
    toast('Link copiado');
  }catch(e){
    if(e && e.name==='AbortError')return;
    try{
      if(navigator.share){await navigator.share({title:c.t,text,url});return}
      await navigator.clipboard.writeText(url);toast('Link copiado');
    }catch(_){}
  }
};

function studygramCanvasToPngFileSync(canvas,id){
  const dataUrl=canvas.toDataURL('image/png');
  const b64=dataUrl.slice(dataUrl.indexOf(',')+1);
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new File([bytes],`ssc-2026-recomendacao-${id}.png`,{type:'image/png',lastModified:Date.now()});
}
function studygramBuildShareFileSync(c,p){
  const pair=exportSlides(c,p), out=document.createElement('canvas');
  out.width=1080; out.height=2160;
  const ctx=out.getContext('2d');
  ctx.drawImage(pair[0],0,0); ctx.drawImage(pair[1],0,1080);
  return studygramCanvasToPngFileSync(out,c.id);
}
function studygramDownloadShareFallback(file,url){
  const href=URL.createObjectURL(file), a=document.createElement('a');
  a.href=href; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();

share=function(id){
