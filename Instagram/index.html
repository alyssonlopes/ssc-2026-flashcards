<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Study Feed — SSC 2026</title>
<style>
:root{--bg:#fff;--ink:#000;--muted:#737373;--line:#dbdbdb;--soft:#fafafa;--blue:#0095f6;--card:#f5f5f5;--max:470px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f5;--muted:#a8a8a8;--line:#262626;--soft:#0f0f0f;--card:#111}}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{margin:0;background:var(--bg)}button,input{font:inherit;color:inherit}.topbar{position:sticky;top:0;z-index:30;height:60px;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.top-inner{width:min(975px,100%);padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;font-weight:700;letter-spacing:-1px}.study-badge{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:6px 10px}.layout{width:min(975px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,var(--max)) 320px;gap:32px;justify-content:center;padding:28px 16px 80px}.feed-col{min-width:0}.stories{display:flex;gap:14px;overflow:auto;padding:8px 2px 18px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 70px;border:0;background:none;padding:0;text-align:center;cursor:pointer}.story-ring{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);margin:auto}.story-ring>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);border:2px solid var(--bg);font-weight:800;font-size:16px}.story.active .story-ring{background:var(--muted)}.story-name{display:block;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post{border-top:1px solid var(--line);padding:14px 0 22px}.post:first-of-type{border-top:0}.post-head{display:flex;align-items:center;gap:10px;padding:0 4px 12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#405de6,#833ab4,#e1306c,#fd1d1d,#fcb045);padding:2px;flex:none}.avatar>span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:11px}.userline{min-width:0;flex:1}.username{font-weight:700;font-size:14px}.subline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:none;font-size:20px;padding:4px 8px}.media{aspect-ratio:1/1;border:1px solid var(--line);border-radius:3px;background:linear-gradient(145deg,#0d9488,#0f766e 45%,#134e4a);display:flex;flex-direction:column;justify-content:space-between;padding:28px;color:#fff;position:relative;overflow:hidden}.media:before,.media:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}.media:before{width:260px;height:260px;right:-90px;top:-90px}.media:after{width:180px;height:180px;left:-70px;bottom:-70px}.media-top,.media-bottom,.media-title{position:relative;z-index:1}.media-top{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}.media-title{font-size:clamp(28px,7vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:95%}.media-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;opacity:.92}.status{border:1px solid rgba(255,255,255,.45);padding:5px 9px;border-radius:999px;font-weight:700}.actions{display:flex;align-items:center;padding:10px 2px 6px;gap:14px}.iconbtn{border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}.iconbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9}.iconbtn.liked svg{fill:#ff3040;stroke:#ff3040}.save{margin-left:auto}.meta-text{padding:0 4px;font-size:14px;line-height:1.38}.likes{font-weight:700;margin:2px 0 6px}.caption{margin-bottom:5px}.caption .username{margin-right:4px}.caption-body{white-space:pre-line}.details{margin-top:7px;color:var(--muted);font-size:13px}.details summary{cursor:pointer;list-style:none}.details summary::-webkit-details-marker{display:none}.details-content{color:var(--ink);padding-top:7px}.post-foot{margin-top:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.side{position:sticky;top:88px;height:max-content;padding-top:12px}.profile{display:flex;align-items:center;gap:12px}.profile .avatar{width:44px;height:44px}.profile-main{font-size:14px}.profile-main b{display:block}.profile-main span{color:var(--muted)}.side-title{display:flex;justify-content:space-between;margin:24px 0 14px;font-size:14px}.side-title b{color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}.side-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:18px}.bottomnav{display:none}.loading,.empty{padding:60px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.progress-strip{position:fixed;top:0;left:0;height:2px;background:var(--blue);width:0;z-index:50;transition:width .2s}
@media(max-width:800px){.layout{display:block;padding:0 0 72px}.side{display:none}.topbar{height:52px}.top-inner{padding:0 14px}.brand{font-size:28px}.study-badge{font-size:11px;padding:5px 8px}.stories{padding:10px 10px 12px;border-bottom:1px solid var(--line)}.post{padding:12px 0 18px}.post-head{padding:0 12px 10px}.media{border-left:0;border-right:0;border-radius:0;padding:24px}.actions,.meta-text{padding-left:12px;padding-right:12px}.bottomnav{position:fixed;bottom:0;left:0;right:0;height:50px;background:var(--bg);border-top:1px solid var(--line);z-index:40;display:flex;align-items:center;justify-content:space-around}.bottomnav button{border:0;background:none;padding:8px}.bottomnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}}
</style>
</head>
<body>
<div class="progress-strip" id="progressStrip"></div>
<header class="topbar"><div class="top-inner"><div class="brand">Studygram</div><div class="study-badge">SSC 2026 • modo estudo</div></div></header>
<main class="layout">
<section class="feed-col">
<div class="stories" id="stories"></div>
<div id="loading" class="loading">Carregando o feed…</div>
<div id="feed"></div>
</section>
<aside class="side">
<div class="profile"><div class="avatar"><span>SSC</span></div><div class="profile-main"><b>ssc2026.study</b><span>Surviving Sepsis Campaign 2026</span></div></div>
<div class="side-title"><b>Seu progresso</b><span id="pct">0%</span></div>
<div class="stat-row"><div class="stat"><b id="readCount">0</b><span>lidos</span></div><div class="stat"><b id="savedCount">0</b><span>salvos</span></div><div class="stat"><b id="totalCount">129</b><span>posts</span></div></div>
<p class="side-note">Feed educacional não oficial baseado nas 129 recomendações e enunciados do PDF da SSC 2026. O progresso é salvo somente neste navegador.</p>
</aside>
</main>
<nav class="bottomnav" aria-label="Navegação"><button id="homeBtn" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button><button id="shuffleBtn" aria-label="Embaralhar"><svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3M17 4l3 3-3 3M4 17h3c1.7 0 3-1.7 4.2-3.7M15 7.8c.8-.5 1.6-.8 2.8-.8H20M17 14l3 3-3 3"/></svg></button><button id="savedBtn" aria-label="Salvos"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></nav>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let ALL=[],currentSection="",onlySaved=false;const KEY="ssc2026-instagram";let memory=JSON.parse(localStorage.getItem(KEY)||'{"read":{},"saved":{},"liked":{}}');
const icons={heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',comment:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9.6 9.6 0 0 1-4-.9L3 21l1.7-4.5A8.5 8.5 0 1 1 21 11.5z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rich(s=''){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function shortSection(s){const map={'Rastreio e manejo inicial':'Rastreio','Infecção e antimicrobianos':'Antimicrobianos','Hemodinâmica':'Hemodinâmica','Ventilação':'Ventilação','Terapias adicionais':'Adjuvantes','Objetivos de cuidado':'Objetivos','Transições de cuidado':'Transições','Recuperação':'Recuperação'};return map[s]||s.split(' ')[0]}
function stories(){let sections=[...new Set(ALL.map(c=>c.s))];$('stories').innerHTML='<button class="story '+(!currentSection&&!onlySaved?'active':'')+'" data-s=""><span class="story-ring"><span>129</span></span><span class="story-name">Todos</span></button>'+sections.map((s,i)=>`<button class="story ${currentSection===s?'active':''}" data-s="${esc(s)}"><span class="story-ring"><span>${shortSection(s).slice(0,2).toUpperCase()}</span></span><span class="story-name">${esc(shortSection(s))}</span></button>`).join('');document.querySelectorAll('.story').forEach(b=>b.onclick=()=>{currentSection=b.dataset.s;onlySaved=false;renderFeed();window.scrollTo({top:0,behavior:'smooth'})})}
function post(c){let saved=!!memory.saved[c.id],liked=!!memory.liked[c.id];let details=[c.f?'<b>Força/certeza:</b> '+rich(c.f):'',c.y?'<b>Tipo:</b> '+rich(c.y):'',c.o?'<b>Observação:</b> '+rich(c.o):'',c.u?'<b>Status em 2026:</b> '+rich(c.u):''].filter(Boolean).join('<br><br>');return `<article class="post" data-id="${c.id}"><div class="post-head"><div class="avatar"><span>SSC</span></div><div class="userline"><div class="username">ssc2026.study</div><div class="subline">${esc(c.s)} · recomendação ${c.id}/129</div></div><button class="more" aria-label="Mais">•••</button></div><div class="media"><div class="media-top">Surviving Sepsis Campaign 2026</div><div class="media-title">${esc(c.t)}</div><div class="media-bottom"><span>PDF · p. ${esc(c.p)}</span><span class="status">${esc((c.g||c.u||'SSC 2026').replace(/\.$/,''))}</span></div></div><div class="actions"><button class="iconbtn like ${liked?'liked':''}" data-action="like" aria-label="Curtir">${icons.heart}</button><button class="iconbtn" data-action="comment" aria-label="Comentários">${icons.comment}</button><button class="iconbtn" data-action="share" aria-label="Compartilhar">${icons.share}</button><button class="iconbtn save ${saved?'liked':''}" data-action="save" aria-label="Salvar">${icons.save}</button></div><div class="meta-text"><div class="likes">${liked?'Você e outras pessoas':'Conteúdo para o internato'}</div><div class="caption"><span class="username">ssc2026.study</span><span class="caption-body">${rich(c.a)}</span></div>${details?`<details class="details"><summary>ver detalhes da recomendação</summary><div class="details-content">${details}</div></details>`:''}<div class="post-foot">Recomendação ${c.id} · página ${c.p} do PDF</div></div></article>`}
function renderFeed(){stories();let items=ALL.filter(c=>(!currentSection||c.s===currentSection)&&(!onlySaved||memory.saved[c.id]));$('feed').innerHTML=items.length?items.map(post).join(''):'<div class="empty">Nenhum post salvo ainda.</div>';bindPosts();stats()}
function bindPosts(){document.querySelectorAll('.post').forEach(p=>{let id=p.dataset.id;p.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.action;if(a==='like'){memory.liked[id]=!memory.liked[id];save();renderFeed()}else if(a==='save'){memory.saved[id]=!memory.saved[id];save();toast(memory.saved[id]?'Salvo para revisar depois':'Removido dos salvos');renderFeed()}else if(a==='share'){let url=location.origin+location.pathname+'#post-'+id;if(navigator.share)navigator.share({title:'SSC 2026 — recomendação '+id,url});else navigator.clipboard?.writeText(url).then(()=>toast('Link copiado'))}else if(a==='comment'){p.querySelector('.details')?.setAttribute('open','')}})});let io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){memory.read[e.target.dataset.id]=true;save(false);stats()}})},{threshold:[.55]});document.querySelectorAll('.post').forEach(p=>io.observe(p));if(location.hash.startsWith('#post-')){let el=document.querySelector(`[data-id="${location.hash.slice(6)}"]`);setTimeout(()=>el?.scrollIntoView({block:'start'}),50)}}
function save(write=true){localStorage.setItem(KEY,JSON.stringify(memory));if(write)stats()}
function stats(){let r=Object.keys(memory.read).filter(k=>memory.read[k]).length,s=Object.keys(memory.saved).filter(k=>memory.saved[k]).length,p=Math.round(r/ALL.length*100)||0;$('readCount').textContent=r;$('savedCount').textContent=s;$('totalCount').textContent=ALL.length||129;$('pct').textContent=p+'%';$('progressStrip').style.width=p+'%'}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function shuffle(){ALL.sort(()=>Math.random()-.5);currentSection='';onlySaved=false;renderFeed();window.scrollTo({top:0,behavior:'smooth'});toast('Feed embaralhado')}
$('homeBtn').onclick=()=>{currentSection='';onlySaved=false;renderFeed();window.scrollTo({top:0,behavior:'smooth'})};$('shuffleBtn').onclick=shuffle;$('savedBtn').onclick=()=>{currentSection='';onlySaved=true;renderFeed();window.scrollTo({top:0,behavior:'smooth'})};
(async()=>{try{let parts=await Promise.all([1,2,3,4,5].map(i=>fetch('../cards-'+i+'.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));ALL=parts.flat().sort((a,b)=>a.id-b.id);$('loading').remove();renderFeed()}catch(e){$('loading').textContent='Não foi possível carregar o conteúdo. Atualize a página.'}})();
</script>
</body>
</html>
