<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Studygram — SSC 2026</title>
<style>
:root{--bg:#fff;--ink:#000;--muted:#737373;--line:#dbdbdb;--soft:#fafafa;--blue:#0095f6;--danger:#ff3040;--max:470px}@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f5;--muted:#a8a8a8;--line:#262626;--soft:#0f0f0f}}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{margin:0;background:var(--bg)}button{font:inherit;color:inherit}.topbar{position:sticky;top:0;z-index:30;height:60px;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.top-inner{width:min(975px,100%);padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;font-weight:700;letter-spacing:-1px}.study-badge{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:6px 10px}.layout{width:min(975px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,var(--max)) 320px;gap:32px;justify-content:center;padding:28px 16px 80px}.feed-col{min-width:0}.stories{display:flex;gap:14px;overflow:auto;padding:8px 2px 18px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 70px;border:0;background:none;padding:0;text-align:center;cursor:pointer}.story-ring{display:block;width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);margin:auto}.story-ring>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#202020,#050505);border:2px solid var(--bg);font-weight:800;font-size:16px;color:#fff}.story.seen .story-ring{background:var(--muted)}.story-name{display:block;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post{border-top:1px solid var(--line);padding:14px 0 22px}.post:first-of-type{border-top:0}.post-head{display:flex;align-items:center;gap:10px;padding:0 4px 12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#405de6,#833ab4,#e1306c,#fd1d1d,#fcb045);padding:2px;flex:none}.avatar>span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:11px}.userline{min-width:0;flex:1}.username{font-weight:700;font-size:14px}.subline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:none;font-size:20px;padding:4px 8px}.carousel-wrap{position:relative}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1;background:#0f766e}.carousel::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;position:relative;overflow:hidden}.cover{background:linear-gradient(145deg,#0d9488,#0f766e 45%,#134e4a);display:flex;flex-direction:column;justify-content:space-between;padding:28px;color:#fff}.cover:before,.cover:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}.cover:before{width:260px;height:260px;right:-90px;top:-90px}.cover:after{width:180px;height:180px;left:-70px;bottom:-70px}.media-top,.media-bottom,.media-title{position:relative;z-index:1}.media-top{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}.media-title{font-size:clamp(28px,7vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:95%}.media-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;opacity:.92}.status{border:1px solid rgba(255,255,255,.45);padding:5px 9px;border-radius:999px;font-weight:700}.content-slide{background:var(--bg);color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:32px 28px 26px;display:flex;flex-direction:column;overflow:auto}.content-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--blue);margin-bottom:18px}.content-body{font-size:clamp(17px,4.3vw,22px);line-height:1.38;font-weight:500}.content-body strong{font-weight:800}.content-meta{margin-top:auto;padding-top:18px;color:var(--muted);font-size:12px;line-height:1.45}.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer}.carousel-arrow.prev{left:8px}.carousel-arrow.next{right:8px}.carousel-arrow[hidden]{display:none}.dots{position:absolute;z-index:5;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:4px}.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.12)}.dot.active{background:var(--blue)}.swipe-hint{position:absolute;right:12px;top:12px;z-index:5;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:5px 8px;font-size:10px}.actions{display:flex;align-items:center;padding:10px 2px 6px;gap:14px}.iconbtn{border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}.iconbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9}.iconbtn.liked svg{fill:var(--danger);stroke:var(--danger)}.iconbtn.saved svg{fill:currentColor}.save{margin-left:auto}.meta-text{padding:0 4px;font-size:14px;line-height:1.38}.likes{font-weight:700;margin:2px 0 6px}.caption{margin-bottom:5px}.caption .username{margin-right:4px}.caption-body{color:var(--muted)}.details{margin-top:7px;color:var(--muted);font-size:13px}.details summary{cursor:pointer;list-style:none}.details summary::-webkit-details-marker{display:none}.details-content{color:var(--ink);padding-top:7px}.post-foot{margin-top:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.side{position:sticky;top:88px;height:max-content;padding-top:12px}.profile{display:flex;align-items:center;gap:12px}.profile .avatar{width:44px;height:44px}.profile-main{font-size:14px}.profile-main b{display:block}.profile-main span{color:var(--muted)}.side-title{display:flex;justify-content:space-between;margin:24px 0 14px;font-size:14px}.side-title b{color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}.side-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:18px}.bottomnav{display:none}.loading,.empty{padding:60px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}.progress-strip{position:fixed;top:0;left:0;height:2px;background:var(--blue);width:0;z-index:50;transition:width .2s}.story-viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}.story-viewer.open{display:flex}.story-stage{width:min(430px,100vw);height:min(820px,100dvh);position:relative;background:linear-gradient(155deg,#0d9488,#0f766e 52%,#082f2e);overflow:hidden;color:#fff;display:flex;flex-direction:column}.story-progress{display:flex;gap:3px;padding:12px 10px 0;z-index:4}.story-seg{height:2px;background:rgba(255,255,255,.35);flex:1;border-radius:99px}.story-seg.done,.story-seg.active{background:#fff}.story-head{display:flex;align-items:center;gap:9px;padding:10px 12px;z-index:4}.story-head .avatar>span{background:#000;color:#fff}.story-head-main{font-size:12px;flex:1}.story-head-main b{display:block;font-size:13px}.story-close{border:0;background:none;color:#fff;font-size:28px;line-height:1;padding:0 3px;cursor:pointer}.story-card{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 28px 50px;overflow:auto}.story-topic{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.8;margin-bottom:16px}.story-title{font-size:clamp(30px,8vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.04em;margin-bottom:24px}.story-answer{font-size:clamp(17px,4.2vw,21px);line-height:1.42}.story-answer strong{font-weight:900}.story-foot{margin-top:20px;font-size:12px;opacity:.78}.story-zone{position:absolute;top:56px;bottom:0;width:34%;z-index:3;border:0;background:transparent}.story-zone.prev{left:0}.story-zone.next{right:0}.story-counter{position:absolute;right:14px;bottom:14px;font-size:11px;opacity:.72;z-index:4}@media(max-width:800px){.layout{display:block;padding:0 0 72px}.side{display:none}.topbar{height:52px}.top-inner{padding:0 14px}.brand{font-size:28px}.study-badge{font-size:11px;padding:5px 8px}.stories{padding:10px 10px 12px;border-bottom:1px solid var(--line)}.post{padding:12px 0 18px}.post-head{padding:0 12px 10px}.cover,.content-slide{border-left:0;border-right:0;padding:24px}.actions,.meta-text{padding-left:12px;padding-right:12px}.carousel-arrow{display:none}.bottomnav{position:fixed;bottom:0;left:0;right:0;height:50px;background:var(--bg);border-top:1px solid var(--line);z-index:40;display:flex;align-items:center;justify-content:space-around}.bottomnav button{border:0;background:none;padding:8px}.bottomnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}.story-stage{width:100vw;height:100dvh}}
</style></head><body>
<div class="progress-strip" id="progressStrip"></div><header class="topbar"><div class="top-inner"><div class="brand">Studygram</div><div class="study-badge">SSC 2026 • modo estudo</div></div></header><main class="layout"><section class="feed-col"><div class="stories" id="stories"></div><div id="loading" class="loading">Carregando o feed…</div><div id="feed"></div></section><aside class="side"><div class="profile"><div class="avatar"><span>SSC</span></div><div class="profile-main"><b>ssc2026.study</b><span>Surviving Sepsis Campaign 2026</span></div></div><div class="side-title"><b>Seu progresso</b><span id="pct">0%</span></div><div class="stat-row"><div class="stat"><b id="readCount">0</b><span>lidos</span></div><div class="stat"><b id="savedCount">0</b><span>salvos</span></div><div class="stat"><b id="totalCount">129</b><span>posts</span></div></div><p class="side-note">Feed educacional não oficial baseado nas 129 recomendações e enunciados do PDF da SSC 2026. O progresso é salvo somente neste navegador.</p></aside></main><nav class="bottomnav" aria-label="Navegação"><button id="homeBtn" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button><button id="shuffleBtn" aria-label="Embaralhar"><svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3M17 4l3 3-3 3M4 17h3c1.7 0 3-1.7 4.2-3.7M15 7.8c.8-.5 1.6-.8 2.8-.8H20M17 14l3 3-3 3"/></svg></button><button id="savedBtn" aria-label="Salvos"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></nav><div class="toast" id="toast"></div><div class="story-viewer" id="storyViewer" aria-hidden="true"><section class="story-stage"><div class="story-progress" id="storyProgress"></div><div class="story-head"><div class="avatar"><span>SSC</span></div><div class="story-head-main"><b>ssc2026.study</b><span id="storySection"></span></div><button class="story-close" id="storyClose" aria-label="Fechar">×</button></div><div class="story-card"><div class="story-topic" id="storyTopic"></div><div class="story-title" id="storyTitle"></div><div class="story-answer" id="storyAnswer"></div><div class="story-foot" id="storyFoot"></div></div><button class="story-zone prev" id="storyPrev" aria-label="Story anterior"></button><button class="story-zone next" id="storyNext" aria-label="Próximo story"></button><div class="story-counter" id="storyCounter"></div></section></div>
<script>
const $=id=>document.getElementById(id);let ALL=[],feedOrder=[],onlySaved=false;const KEY='ssc2026-instagram-v2';let memory=JSON.parse(localStorage.getItem(KEY)||'{"read":{},"saved":{},"liked":{},"stories":{}}');let storyItems=[],storyIndex=0;const icons={heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',comment:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9.6 9.6 0 0 1-4-.9L3 21l1.7-4.5A8.5 8.5 0 1 1 21 11.5z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function rich(s=''){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function saveMemory(){localStorage.setItem(KEY,JSON.stringify(memory))}function shortSection(s){const map={'Rastreio e manejo inicial':'Rastreio','Infecção e antimicrobianos':'Antimicrobianos','Hemodinâmica':'Hemodinâmica','Suporte respiratório':'Respiratório','Terapias adjuvantes':'Adjuvantes','Objetivos de cuidado':'Objetivos','Transições de cuidado':'Transições','Recuperação':'Recuperação'};return map[s]||s.split(' ')[0]}function storyButtons(){const sections=[...new Set(ALL.map(c=>c.s))];$('stories').innerHTML=sections.map(s=>{const seen=memory.stories[s]?' seen':'';return `<button class="story${seen}" data-s="${esc(s)}"><span class="story-ring"><span>${esc(shortSection(s).slice(0,2).toUpperCase())}</span></span><span class="story-name">${esc(shortSection(s))}</span></button>`}).join('');document.querySelectorAll('.story').forEach(b=>b.addEventListener('click',()=>openStories(b.dataset.s)))}function contentMeta(c){return [c.f?`<b>Força/certeza:</b> ${rich(c.f)}`:'',c.y?`<b>Tipo:</b> ${rich(c.y)}`:'',c.o?`<b>Observação:</b> ${rich(c.o)}`:''].filter(Boolean).join('<br><br>')}function post(c){const saved=!!memory.saved[c.id],liked=!!memory.liked[c.id];return `<article class="post" data-id="${c.id}"><div class="post-head"><div class="avatar"><span>SSC</span></div><div class="userline"><div class="username">ssc2026.study</div><div class="subline">${esc(c.s)} · recomendação ${c.id}/129</div></div><button class="more">•••</button></div><div class="carousel-wrap"><div class="carousel" data-carousel><section class="slide cover"><div class="media-top">Surviving Sepsis Campaign 2026</div><div class="media-title">${esc(c.t)}</div><div class="media-bottom"><span>PDF · p. ${esc(c.p)}</span><span class="status">${esc((c.g||'SSC 2026').replace(/\.$/,''))}</span></div></section><section class="slide content-slide"><div class="content-kicker">Recomendação ${c.id} • leia o conteúdo</div><div class="content-body">${rich(c.a)}</div><div class="content-meta">${contentMeta(c)}</div></section></div><button class="carousel-arrow prev" data-slide-prev hidden>‹</button><button class="carousel-arrow next" data-slide-next>›</button><div class="dots"><span class="dot active"></span><span class="dot"></span></div><span class="swipe-hint">1/2</span></div><div class="actions"><button class="iconbtn like ${liked?'liked':''}" data-action="like">${icons.heart}</button><button class="iconbtn" data-action="comment">${icons.comment}</button><button class="iconbtn" data-action="share">${icons.share}</button><button class="iconbtn save ${saved?'saved':''}" data-action="save">${icons.save}</button></div><div class="meta-text"><div class="likes">${liked?'Você marcou este conteúdo':'Conteúdo para o internato'}</div><div class="caption"><span class="username">ssc2026.study</span><span class="caption-body"> Deslize para a segunda imagem para ler a recomendação completa.</span></div>${c.u?`<details class="details"><summary>status em 2026</summary><div class="details-content">${rich(c.u)}</div></details>`:''}<div class="post-foot">Recomendação ${c.id} · página ${c.p} do PDF</div></div></article>`}function attachCarousels(){document.querySelectorAll('.post').forEach(p=>{const carousel=p.querySelector('[data-carousel]'),dots=[...p.querySelectorAll('.dot')],hint=p.querySelector('.swipe-hint'),prev=p.querySelector('[data-slide-prev]'),next=p.querySelector('[data-slide-next]');const set=i=>carousel.scrollTo({left:i*carousel.clientWidth,behavior:'smooth'});prev.onclick=()=>set(0);next.onclick=()=>set(1);let ticking=false;carousel.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const i=Math.round(carousel.scrollLeft/Math.max(1,carousel.clientWidth));dots.forEach((d,j)=>d.classList.toggle('active',i===j));hint.textContent=`${i+1}/2`;prev.hidden=i===0;next.hidden=i===1;if(i===1){memory.read[p.dataset.id]=true;saveMemory();updateStats()}ticking=false})})})}function renderFeed(){const items=onlySaved?feedOrder.filter(c=>memory.saved[c.id]):feedOrder;$('feed').innerHTML=items.length?items.map(post).join(''):'<div class="empty">Nenhum conteúdo salvo ainda.</div>';attachCarousels();document.querySelectorAll('.post').forEach(p=>p.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;const id=p.dataset.id;if(action==='like'){memory.liked[id]=!memory.liked[id];e.target.closest('button').classList.toggle('liked',memory.liked[id])}if(action==='save'){memory.saved[id]=!memory.saved[id];e.target.closest('button').classList.toggle('saved',memory.saved[id]);toast(memory.saved[id]?'Salvo para revisar':'Removido dos salvos');if(onlySaved&&!memory.saved[id])renderFeed()}if(action==='share')shareCard(id);if(action==='comment')toast('Use a segunda imagem como seu resumo de estudo');saveMemory();updateStats()}));observePosts()}function observePosts(){if(window.feedObserver)window.feedObserver.disconnect();window.feedObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){memory.read[e.target.dataset.id]=true;saveMemory();updateStats()}})},{threshold:[.55]});document.querySelectorAll('.post').forEach(p=>window.feedObserver.observe(p))}function updateStats(){const read=Object.keys(memory.read).filter(k=>memory.read[k]).length,saved=Object.keys(memory.saved).filter(k=>memory.saved[k]).length,pct=ALL.length?Math.round(read/ALL.length*100):0;$('readCount').textContent=read;$('savedCount').textContent=saved;$('totalCount').textContent=ALL.length;$('pct').textContent=pct+'%';$('progressStrip').style.width=pct+'%'}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1700)}async function shareCard(id){const c=ALL.find(x=>String(x.id)===String(id)),text=`SSC 2026 — ${c.t}\n\n${c.a.replace(/\*\*/g,'')}`;try{if(navigator.share)await navigator.share({title:'SSC 2026',text});else await navigator.clipboard.writeText(text),toast('Conteúdo copiado')}catch(e){}}function openStories(section){storyItems=ALL.filter(c=>c.s===section);storyIndex=0;memory.stories[section]=true;saveMemory();storyButtons();$('storyViewer').classList.add('open');$('storyViewer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';renderStory()}function renderStory(){if(!storyItems.length)return;const c=storyItems[storyIndex];$('storySection').textContent=shortSection(c.s);$('storyTopic').textContent=`Recomendação ${c.id} • ${c.g||'SSC 2026'}`;$('storyTitle').textContent=c.t;$('storyAnswer').innerHTML=rich(c.a);$('storyFoot').textContent=`PDF • página ${c.p}`;$('storyCounter').textContent=`${storyIndex+1}/${storyItems.length}`;$('storyProgress').innerHTML=storyItems.map((_,i)=>`<span class="story-seg ${i<storyIndex?'done':i===storyIndex?'active':''}"></span>`).join('');memory.read[c.id]=true;saveMemory();updateStats()}function nextStory(){if(storyIndex<storyItems.length-1){storyIndex++;renderStory()}else closeStories()}function prevStory(){if(storyIndex>0){storyIndex--;renderStory()}}function closeStories(){$('storyViewer').classList.remove('open');$('storyViewer').setAttribute('aria-hidden','true');document.body.style.overflow=''}function shuffle(){for(let i=feedOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[feedOrder[i],feedOrder[j]]=[feedOrder[j],feedOrder[i]]}onlySaved=false;renderFeed();window.scrollTo({top:0,behavior:'smooth'});toast('Feed embaralhado')}async function init(){try{const parts=await Promise.all([1,2,3,4,5].map(i=>fetch(`../cards-${i}.json`).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})));ALL=parts.flat();if(ALL.length!==129)throw Error('Esperados 129 cards, recebidos '+ALL.length);feedOrder=[...ALL];$('loading').remove();storyButtons();renderFeed();updateStats()}catch(e){$('loading').textContent='Não foi possível carregar os 129 conteúdos. Atualize a página.';console.error(e)}}$('homeBtn').onclick=()=>{onlySaved=false;renderFeed();window.scrollTo({top:0,behavior:'smooth'})};$('shuffleBtn').onclick=shuffle;$('savedBtn').onclick=()=>{onlySaved=!onlySaved;renderFeed();window.scrollTo({top:0,behavior:'smooth'});toast(onlySaved?'Mostrando salvos':'Mostrando todos')};$('storyClose').onclick=closeStories;$('storyNext').onclick=nextStory;$('storyPrev').onclick=prevStory;document.addEventListener('keydown',e=>{if(!$('storyViewer').classList.contains('open'))return;if(e.key==='Escape')closeStories();if(e.key==='ArrowRight')nextStory();if(e.key==='ArrowLeft')prevStory()});init();
</script></body></html>
