<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Studygram</title><style>

template-columns:repeat(3,1fr);gap:4px}.tile{border:0;padding:0;aspect-ratio:1/1;position:relative;overflow:hidden;color:#fff;text-align:left;cursor:pointer;background:linear-gradient(145deg,var(--accent),var(--accent2))}.tile:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-45px;top:-45px}.tile-content{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.tile-num{font-size:11px;font-weight:800;opacity:.8}.tile-title{font-weight:800;font-size:clamp(12px,2vw,18px);line-height:1.08}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.post-card{background:var(--bg);width:min(500px,100%);max-height:92dvh;overflow:auto;border-radius:6px;position:relative}.modal-close{position:fixed;right:18px;top:16px;border:0;background:none;color:white;font-size:34px;z-index:61}.post-top{display:flex;align-items:center;gap:10px;padding:12px}.post-top img{width:38px;height:38px;border-radius:50%}.post-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1}.post-carousel::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;padding:28px;display:flex;flex-direction:column}.cover{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;justify-content:space-between}.cover small{font-weight:800;text-transform:uppercase;letter-spacing:.08em}.cover h2{font-size:clamp(30px,7vw,42px);line-height:1.03;margin:0}.answer{background:var(--bg);overflow:auto}.answer small{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.answer-body{font-size:clamp(17px,4vw,21px);line-height:1.42;margin-top:18px}.answer-meta{font-size:12px;color:var(--muted);line-height:1.45;margin-top:auto;padding-top:18px}.post-bottom{padding:12px;font-size:13px;color:var(--muted)}.story-viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}.story-viewer.open{display:flex}.story-stage{width:min(430px,100vw);height:min(820px,100dvh);position:relative;color:#fff;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--accent),var(--accent2));overflow:hidden}.story-progress{display:flex;gap:3px;padding:12px 10px 0}.story-seg{height:2px;flex:1;background:rgba(255,255,255,.35)}.story-seg.done,.story-seg.active{background:#fff}.story-head{display:flex;align-items:center;gap:9px;padding:10px 12px;z-index:4}.story-head img{width:38px;height:38px;border-radius:50%;border:2px solid #fff}.story-head-main{font-size:12px;flex:1}.story-head-main b{display:block;font-size:13px}.story-close{border:0;background:none;color:#fff;font-size:28px}.story-card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 28px 50px;overflow:auto}.story-topic{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.8}.story-title{font-size:clamp(30px,8vw,44px);line-height:1.02;font-weight:800;margin:16px 0 24px}.story-answer{font-size:clamp(17px,4.2vw,21px);line-height:1.42}.story-foot{font-size:12px;opacity:.75;margin-top:18px}.story-zone{position:absolute;top:55px;bottom:0;width:34%;border:0;background:transparent}.story-zone.prev{left:0}.story-zone.next{right:0}.notfound{max-width:600px;margin:80px auto;padding:24px;text-align:center}.notfound a{color:var(--blue);font-weight:700}@media(max-width:650px){.shell{padding:16px 0 60px}.profile-head{grid-template-columns:100px 1fr;gap:16px;padding:8px 16px 24px}.avatar-ring{width:88px;height:88px;padding:3px}.identity h1{font-size:18px;margin-bottom:10px}.stats{gap:14px;font-size:13px;margin-bottom:10px}.bio,.display-name{font-size:13px}.tabs{height:44px}.tab-active{height:44px}.grid{gap:2px}.tile-content{padding:9px}.tile-title{font-size:12px}.story-stage{width:100vw;height:100dvh}.modal{padding:0}.post-card{width:100vw;max-height:100dvh;height:100dvh;border-radius:0}.modal-close{right:12px;top:6px;color:var(--ink);position:absolute}.post-carousel{aspect-ratio:auto;height:calc(100dvh - 120px)}}
</style></head><body><header class="bar"><div class="bar-inner"><a class="back" href="/ssc-2026-flashcards/Instagram/">‹</a><div class="bar-user" id="barUser"></div></div></header><main class="shell" id="shell"><section class="profile-head"><button class="profile-story" id="profileStory"><span class="avatar-ring" id="profileAvatar"></span></button><div class="identity"><h1 id="username"></h1><div class="stats"><span><b id="postCount">0</b> posts</span><span><b id="readCount">0</b> lidos</span><span><b id="savedCount">0</b> salvos</span></div><div class="display-name" id="displayName"></div><div class="bio" id="bio"></div><a class="story-link" href="#" id="storyLink">Ver stories deste perfil</a></div></section><div class="tabs"><span class="tab-active">▦ Publicações</span></div><section class="grid" id="grid"></section></main><div class="modal" id="postModal"><button class="modal-close" id="modalClose">×</button><article class="post-card" id="modalContent"></article></div><div class="story-viewer" id="storyViewer"><section class="story-stage"><div class="story-progress" id="storyProgress"></div><div class="story-head"><span id="storyAvatar"></span><div class="story-head-main"><b id="storyUser"></b><span id="storySection"></span></div><button class="story-close" id="storyClose">×</button></div><div class="story-card"><div class="story-topic" id="storyTopic"></div><div class="story-title" id="storyTitle"></div><div class="story-answer" id="storyAnswer"></div><div class="story-foot" id="storyFoot"></div></div><button class="story-zone prev" id="storyPrev"></button><button class="story-zone next" id="storyNext"></button></section></div><script>
const PROFILES={"Rastreio e manejo inicial":{"username":"rastreio.sepse","name":"Rastreio & Manejo Inicial","bio":"Reconhecimento precoce, rastreio, lactato, culturas e primeiros passos no manejo da sepse.","accent":"#f59e0b","accent2":"#ef4444","icon":"radar"},"Infecção e antimicrobianos":{"username":"antimicrobianos.sepse","name":"Antimicrobianos","bio":"Antibióticos, controle do foco, descalonamento, resistência e decisões antimicrobianas na sepse.","accent":"#8b5cf6","accent2":"#ec4899","icon":"capsule"},"Hemodinâmica":{"username":"hemodinamica.sepse","name":"Hemodinâmica","bio":"Fluidos, PAM, vasopressores, perfusão e monitorização hemodinâmica no choque séptico.","accent":"#ef4444","accent2":"#f97316","icon":"heart"},"Suporte respiratório":{"username":"respiratorio.sepse","name":"Suporte Respiratório","bio":"Oxigenação, ventilação mecânica, SDRA, prona e estratégias de suporte respiratório.","accent":"#06b6d4","accent2":"#3b82f6","icon":"lungs"},"Terapias adjuvantes":{"username":"adjuvantes.sepse","name":"Terapias Adjuvantes","bio":"Corticoide, transfusão, glicemia, nutrição, profilaxias e outras terapias de suporte.","accent":"#10b981","accent2":"#14b8a6","icon":"iv"},"Objetivos de cuidado":{"username":"objetivos.sepse","name":"Objetivos de Cuidado","bio":"Comunicação, tomada de decisão, metas terapêuticas e integração de cuidados paliativos.","accent":"#6366f1","accent2":"#8b5cf6","icon":"compass"},"Transições de cuidado":{"username":"transicoes.sepse","name":"Transições de Cuidado","bio":"Alta da UTI, reconciliação medicamentosa, comunicação e continuidade do cuidado.","accent":"#f43f5e","accent2":"#a855f7","icon":"bridge"},"Recuperação":{"username":"recuperacao.sepse","name":"Recuperação Pós-Sepse","bio":"Reabilitação, saúde mental, cognição e acompanhamento após a hospitalização por sepse.","accent":"#22c55e","accent2":"#eab308","icon":"sunrise"}},ICONS={"radar":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\"><circle cx=\"64\" cy=\"64\" r=\"30\"/><circle cx=\"64\" cy=\"64\" r=\"13\"/><path d=\"M64 64 91 46M64 18v9M18 64h9M101 64h9\"/></g><circle cx=\"91\" cy=\"46\" r=\"7\" fill=\"white\"/>","capsule":"<g fill=\"none\" stroke=\"white\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M38 84 84 38a20 20 0 0 1 28 28L66 112a20 20 0 0 1-28-28Z\"/><path d=\"m59 63 28 28\"/><circle cx=\"33\" cy=\"36\" r=\"8\"/><circle cx=\"24\" cy=\"56\" r=\"5\"/></g>","heart":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M64 111 25 72C5 52 17 21 43 21c10 0 18 5 21 12 4-7 12-12 22-12 26 0 38 31 18 51Z\"/><path d=\"M18 66h21l8-17 12 34 10-20h39\"/></g>","lungs":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M61 58V25M67 58V25M61 51C46 49 30 61 25 80c-6 25 8 31 22 23 10-6 14-19 14-45ZM67 51c15-2 31 10 36 29 6 25-8 31-22 23-10-6-14-19-14-45Z\"/></g>","iv":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M45 17h38M64 17v18M44 35h40v55a20 20 0 0 1-40 0Z\"/><path d=\"M44 60h40M64 110v10M64 120h22\"/><path d=\"M64 74c8 9 9 14 0 21-9-7-8-12 0-21Z\" fill=\"white\"/></g>","compass":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"64\" cy=\"64\" r=\"43\"/><path d=\"m79 42-10 31-31 10 10-31Z\"/><circle cx=\"64\" cy=\"64\" r=\"5\" fill=\"white\"/></g>","bridge":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 96h94M27 96V61M101 96V61M27 61c15 0 24-9 37-25 13 16 22 25 37 25M37 61v35M91 61v35M52 51v45M76 51v45\"/></g>","sunrise":"<g fill=\"none\" stroke=\"white\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 91h92M35 91a29 29 0 0 1 58 0M64 20v15M27 36l11 11M101 36 90 47M17 63h15M96 63h15\"/></g>"},$=id=>document.getElementById(id),KEY='ssc2026-instagram-v4';let memory=JSON.parse(localStorage.getItem(KEY)||'{"read":{},"saved":{},"liked":{},"stories":{}}'),ALL=[],PROFILE=null,SECTION='',storyIndex=0;const pathUser=(window.__testUsername||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||''));function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function rich(s=''){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function save(){localStorage.setItem(KEY,JSON.stringify(memory))}function avatarData(p){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p.accent}"/><stop offset="1" stop-color="${p.accent2}"/></linearGradient></defs><circle cx="64" cy="64" r="64" fill="url(#g)"/>${ICONS[p.icon]}</svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function img(p){return `<img src="${avatarData(p)}" alt="${esc(p.name)}">`}function meta(c){return [c.f?`<b>Força/certeza:</b> ${rich(c.f)}`:'',c.y?`<b>Tipo:</b> ${rich(c.y)}`:'',c.o?`<b>Observação:</b> ${rich(c.o)}`:''].filter(Boolean).join('<br><br>')}function render(){document.documentElement.style.setProperty('--accent',PROFILE.accent);document.documentElement.style.setProperty('--accent2',PROFILE.accent2);document.title=`${PROFILE.username} — Studygram SSC 2026`;$('barUser').textContent=PROFILE.username;$('profileAvatar').innerHTML=img(PROFILE);$('username').textContent=PROFILE.username;$('displayName').textContent=PROFILE.name;$('bio').textContent=PROFILE.bio;$('postCount').textContent=ALL.length;$('readCount').textContent=ALL.filter(c=>memory.read[c.id]).length;$('savedCount').textContent=ALL.filter(c=>memory.saved[c.id]).length;$('grid').innerHTML=ALL.map(c=>`<button class="tile" data-id="${c.id}"><span class="tile-content"><span class="tile-num">${c.id}/129</span><span class="tile-title">${esc(c.t)}</span></span></button>`).join('');document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>openPost(t.dataset.id))}function openPost(id){const c=ALL.find(x=>String(x.id)===String(id));$('modalContent').innerHTML=`<div class="post-top">${img(PROFILE)}<b>${esc(PROFILE.username)}</b></div><div class="post-carousel"><section class="slide cover"><small>${esc(PROFILE.name)} • recomendação ${c.id}</small><h2>${esc(c.t)}</h2><small>PDF • p. ${c.p} • deslize →</small></section><section class="slide answer"><small>Recomendação ${c.id}</small><div class="answer-body">${rich(c.a)}</div><div class="answer-meta">${meta(c)}</div></section></div><div class="post-bottom">Deslize horizontalmente para ler a segunda imagem.</div>`;$('postModal').classList.add('open');memory.read[c.id]=true;save();render()}function closePost(){$('postModal').classList.remove('open')}function openStories(){storyIndex=0;memory.stories[PROFILE.username]=true;save();$('storyViewer').classList.add('open');document.body.style.overflow='hidden';story()}function story(){const c=ALL[storyIndex];$('storyAvatar').innerHTML=img(PROFILE);$('storyUser').textContent=PROFILE.username;$('storySection').textContent=PROFILE.name;$('storyTopic').textContent=`Recomendação ${c.id} • ${c.g||'SSC 2026'}`;$('storyTitle').textContent=c.t;$('storyAnswer').innerHTML=rich(c.a);$('storyFoot').textContent=`${storyIndex+1}/${ALL.length} • PDF p. ${c.p}`;$('storyProgress').innerHTML=ALL.map((_,i)=>`<span class="story-seg ${i<storyIndex?'done':i===storyIndex?'active':''}"></span>`).join('');memory.read[c.id]=true;save()}function closeStories(){$('storyViewer').classList.remove('open');document.body.style.overflow=''}function nextStory(){storyIndex<ALL.length-1?(storyIndex++,story()):closeStories()}function prevStory(){if(storyIndex>0){storyIndex--;story()}}async function init(){for(const [s,p] of Object.entries(PROFILES))if(p.username===pathUser){PROFILE=p;SECTION=s;break}if(!PROFILE){$('shell').innerHTML=`<div class="notfound"><h1>Perfil não encontrado</h1><p>Esse endereço não corresponde a um perfil do Studygram.</p><a href="/ssc-2026-flashcards/Instagram/">Voltar ao feed</a></div>`;return}try{const parts=await Promise.all([1,2,3,4,5].map(i=>fetch(`/ssc-2026-flashcards/cards-${i}.json`).then(r=>r.json())));ALL=parts.flat().filter(c=>c.s===SECTION);render()}catch(e){$('shell').innerHTML='<div class="notfound"><h1>Erro ao carregar o perfil</h1></div>'}}$('profileStory').onclick=openStories;$('storyLink').onclick=e=>{e.preventDefault();openStories()};$('modalClose').onclick=closePost;$('postModal').onclick=e=>{if(e.target===$('postModal'))closePost()};$('storyClose').onclick=closeStories;$('storyNext').onclick=nextStory;$('storyPrev').onclick=prevStory;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeStories();closePost()}if($('storyViewer').classList.contains('open')){if(e.key==='ArrowRight')nextStory();if(e.key==='ArrowLeft')prevStory()}});init();
</script></body></html>
