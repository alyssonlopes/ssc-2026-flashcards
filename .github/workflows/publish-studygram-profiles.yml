name: Publish Studygram profiles

on:
  push:
    paths:
      - '.github/workflows/publish-studygram-profiles.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild feed and profile router
        run: |
          cat .deploy/feed.part1 .deploy/feed.part2 .deploy/feed.part3 | base64 -d | gzip -d > Instagram/index.html
          cat .deploy/404.part1 .deploy/404.part2 | base64 -d | gzip -d > 404.html
      - name: Verify exact files and JavaScript
        run: |
          echo '3e4d42b39569b938d955d737afe590acf304819b4a1fdfb351b436ae26a94034  Instagram/index.html' | sha256sum -c -
          echo 'b3c415c20a783c430a931107a87d35f9c79554563959b296e6c41f2d036912c6  404.html' | sha256sum -c -
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [('Instagram/index.html','/tmp/feed.js'),('404.html','/tmp/profile.js')]:
              text=Path(source).read_text()
              scripts=re.findall(r'<script>(.*?)</script>', text, re.S)
              if not scripts:
                  raise SystemExit(f'No inline script found in {source}')
              Path(target).write_text('\n'.join(scripts))
          PY
          node --check /tmp/feed.js
          node --check /tmp/profile.js
          grep -q 'rastreio.sepse' Instagram/index.html
          grep -q 'antimicrobianos.sepse' Instagram/index.html
          grep -q 'hemodinamica.sepse' Instagram/index.html
          grep -q 'respiratorio.sepse' Instagram/index.html
          grep -q 'adjuvantes.sepse' Instagram/index.html
          grep -q 'objetivos.sepse' Instagram/index.html
          grep -q 'transicoes.sepse' Instagram/index.html
          grep -q 'recuperacao.sepse' Instagram/index.html
      - name: Commit published version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Instagram/index.html 404.html
          git rm .deploy/feed.part1 .deploy/feed.part2 .deploy/feed.part3 .deploy/404.part1 .deploy/404.part2
          git rm .github/workflows/publish-studygram-profiles.yml
          git commit -m 'Add themed Studygram profiles and profile stories'
          git push
