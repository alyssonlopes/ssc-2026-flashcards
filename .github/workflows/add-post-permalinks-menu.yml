name: Add post permalinks and exports

on:
  push:
    paths:
      - '.github/workflows/add-post-permalinks-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Studygram feed
        run: python .github/scripts/patch-post-menu.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Instagram/index.html
          git rm .github/workflows/add-post-permalinks-menu.yml .github/scripts/patch-post-menu.py
          git commit -m "Add post menu, permalinks and source references"
          git push
# retry after resilient share patch
