name: Add post permalinks and exports

on:
  push:
    paths:
      - '.github/workflows/add-post-permalinks-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add post menu, permalink page and exports
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('Instagram/index.html')
          s = home.read_text()

          menu_css = r'''
.post-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:95;display:none;align-items:center;justify-content:center;padding:18px}.post-menu-backdrop.open{display:flex}.post-menu-sheet{width:min(420px,100%);max-height:88dvh;overflow:auto;background:var(--bg);border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}.post-menu-head{padding:16px 18px 11px;border-bottom:1px solid var(--line)}.post-menu-head b{display:block;font-size:14px}.post-menu-head span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.post-menu-item{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 18px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.post-menu-item:hover{background:var(--soft)}.post-menu-item.primary{font-weight:700;color:var(--blue)}.post-menu-item.source{display:block;line-height:1.35}.post-menu-item.source small{display:block;color:var(--muted);margin-top:3px}.post-menu-label{padding:14px 18px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.post-menu-cancel{font-weight:700;text-align:center;justify-content:center}.post-menu-status{padding:10px 18px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
@media(max-width:800px){.post-menu-backdrop{align-items:flex-end;padding:0}.post-menu-sheet{width:100%;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}.post-menu-sheet:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 2px}}
'''
          if '.post-menu-backdrop{' not in s:
              s = s.replace('</style>', menu_css + '</style>', 1)

          old_more = '<button class="more">•••</button>'
          new_more = '<button class="more" data-menu="${c.id}" aria-label="Mais opções">•••</button>'
          if old_more in s:
              s = s.replace(old_more, new_more, 1)
          elif 'data-menu="${c.id}"' not in s:
              raise SystemExit('more button marker not found')

          menu_html = '<div class="post-menu-backdrop" id="postMenu" role="dialog" aria-modal="true" aria-label="Opções da publicação"><section class="post-menu-sheet" id="postMenuSheet"></section></div>'
          if 'id="postMenu"' not in s:
              s = s.replace('<div class="toast" id="toast"></div>', menu_html + '<div class="toast" id="toast"></div>', 1)

          attach_marker = "document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>openStories(b.dataset.story));"
          attach_add = attach_marker + "document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();openPostMenu(b.dataset.menu)});"
          if "openPostMenu(b.dataset.menu)" not in s:
              if attach_marker not in s: raise SystemExit('attach marker not found')
              s = s.replace(attach_marker, attach_add, 1)

          share_old = "async function share(id){const c=ALL.find(x=>String(x.id)===String(id)),p=profileFor(c),text=`${p.username} — SSC 2026\n${c.t}\n\n${c.a.replace(/\\*\\*/g,'')}`;try{if(navigator.share)await navigator.share({title:c.t,text});else await navigator.clipboard.writeText(text),toast('Conteúdo copiado')}catch(e){}}"
          share_new = "async function share(id){const c=ALL.find(x=>String(x.id)===String(id)),p=profileFor(c),text=`${p.username} — SSC 2026\n${c.t}\n\n${c.a.replace(/\\*\\*/g,'')}`,url=postUrl(id);try{if(navigator.share)await navigator.share({title:c.t,text,url});else await navigator.clipboard.writeText(`${text}\n\n${url}`),toast('Conteúdo e link copiados')}catch(e){}}"
          if share_old in s:
              s = s.replace(share_old, share_new, 1)
          elif 'url=postUrl(id)' not in s:
              raise SystemExit('share marker not found')

          helpers = r'''
const SOURCE_CCM='https://doi.org/10.1097/CCM.0000000000007075',SOURCE_ICM='https://doi.org/10.1007/s00134-026-08361-1';
function postUrl(id){return `${location.origin}/ssc-2026-flashcards/Instagram/post/?id=${encodeURIComponent(id)}`}
function plain(s=''){return String(s).replace(/\*\*/g,'').replace(/\s+/g,' ').trim()}
async function copyPostLink(id){try{await navigator.clipboard.writeText(postUrl(id));toast('Link da publicação copiado')}catch(e){}}
function closePostMenu(){$('postMenu').classList.remove('open')}
function openPostMenu(id){const c=ALL.find(x=>String(x.id)===String(id));if(!c)return;const p=profileFor(c);$('postMenuSheet').innerHTML=`<div class="post-menu-head"><b>${esc(p.username)}</b><span>Recomendação ${c.id} · ${esc(c.t)}</span></div><button class="post-menu-item primary" data-mi="open">Abrir publicação <span>›</span></button><button class="post-menu-item" data-mi="copy">Copiar link <span>⧉</span></button><button class="post-menu-item" data-mi="image">Baixar como imagem <span>PNG</span></button><button class="post-menu-item" data-mi="pdf">Baixar como PDF <span>2 páginas</span></button><div class="post-menu-label">Referências e fonte</div><div class="post-menu-status">No PDF usado para este conteúdo: página ${c.p}</div><a class="post-menu-item source" href="${SOURCE_CCM}" target="_blank" rel="noopener"><b>Critical Care Medicine</b><small>Surviving Sepsis Campaign 2026 · DOI 10.1097/CCM.0000000000007075</small></a><a class="post-menu-item source" href="${SOURCE_ICM}" target="_blank" rel="noopener"><b>Intensive Care Medicine</b><small>Surviving Sepsis Campaign 2026 · DOI 10.1007/s00134-026-08361-1</small></a><button class="post-menu-item post-menu-cancel" data-mi="cancel">Cancelar</button>`;$('postMenu').classList.add('open');$('postMenuSheet').querySelectorAll('[data-mi]').forEach(b=>b.onclick=async()=>{const a=b.dataset.mi;if(a==='open')location.href=postUrl(id);if(a==='copy'){await copyPostLink(id);closePostMenu()}if(a==='image'){closePostMenu();await downloadPostImage(c,p)}if(a==='pdf'){closePostMenu();await downloadPostPdf(c,p)}if(a==='cancel')closePostMenu()})}
function wrapCanvas(ctx,text,maxWidth){const out=[];for(const para of String(text||'').split(/\n+/)){const words=para.trim().split(/\s+/).filter(Boolean);let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=w}else line=test}if(line)out.push(line);if(!words.length)out.push('')}return out}
function fitCanvas(ctx,text,maxWidth,maxHeight,start=50,min=22){for(let size=start;size>=min;size-=2){ctx.font=`500 ${size}px Arial, sans-serif`;const lines=wrapCanvas(ctx,text,maxWidth),lh=size*1.3;if(lines.length*lh<=maxHeight)return {size,lines,lh}}ctx.font=`500 ${min}px Arial, sans-serif`;const lines=wrapCanvas(ctx,text,maxWidth);return {size:min,lines,lh:min*1.25}}
function drawLines(ctx,lines,x,y,lh,maxLines=999){lines.slice(0,maxLines).forEach((line,i)=>ctx.fillText(line,x,y+i*lh))}
function exportSlides(c,p){const W=1080,H=1080,cover=document.createElement('canvas'),body=document.createElement('canvas');cover.width=body.width=W;cover.height=body.height=H;let x=cover.getContext('2d'),g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,p.accent);g.addColorStop(1,p.accent2);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(930,120,260,0,Math.PI*2);x.fill();x.beginPath();x.arc(70,1010,210,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='700 30px Arial';x.fillText(p.name.toUpperCase(),70,92);x.font='700 27px Arial';x.fillText(`RECOMENDAÇÃO ${c.id} / 129`,70,142);const ft=fitCanvas(x,plain(c.t),W-140,610,76,42);x.font=`800 ${ft.size}px Arial`;x.textBaseline='top';drawLines(x,ft.lines,70,260,ft.lh);x.textBaseline='alphabetic';x.font='600 28px Arial';x.fillText(`PDF · página ${c.p}`,70,990);x.textAlign='right';x.fillText(plain(c.g||'SSC 2026'),W-70,990);x.textAlign='left';let y=body.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,W,H);y.fillStyle='#087cc1';y.font='800 28px Arial';y.fillText(`RECOMENDAÇÃO ${c.id} · SSC 2026`,65,78);y.fillStyle='#111';y.textBaseline='top';const answer=fitCanvas(y,plain(c.a),W-130,690,50,22);y.font=`500 ${answer.size}px Arial`;drawLines(y,answer.lines,65,135,answer.lh);let bottom=135+answer.lines.length*answer.lh+28;y.font='600 24px Arial';y.fillStyle='#555';const extras=[c.f&&`Força/certeza: ${plain(c.f)}`,c.y&&`Tipo: ${plain(c.y)}`,c.o&&`Observação: ${plain(c.o)}`].filter(Boolean).join(' · ');const ex=fitCanvas(y,extras,W-130,Math.max(90,900-bottom),24,18);y.font=`500 ${ex.size}px Arial`;drawLines(y,ex.lines,65,bottom,ex.lh,8);y.textBaseline='alphabetic';y.fillStyle='#777';y.font='500 20px Arial';y.fillText(`Fonte: Surviving Sepsis Campaign 2026 · PDF p. ${c.p}`,65,1015);return [cover,body]}
function triggerDownload(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function canvasBlob(canvas,type='image/png',quality=.95){return new Promise(res=>canvas.toBlob(res,type,quality))}
async function downloadPostImage(c,p){toast('Gerando imagem…');const [a,b]=exportSlides(c,p),out=document.createElement('canvas');out.width=1080;out.height=2160;const x=out.getContext('2d');x.drawImage(a,0,0);x.drawImage(b,0,1080);const blob=await canvasBlob(out);triggerDownload(blob,`ssc-2026-recomendacao-${c.id}.png`)}
function ascii(s){return new TextEncoder().encode(s)}function concatBytes(parts){let n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n),p=0;for(const b of parts){o.set(b,p);p+=b.length}return o}function jpegBytes(canvas){const bin=atob(canvas.toDataURL('image/jpeg',.92).split(',')[1]),o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o}
function pdfFromCanvases(canvases){const imgs=canvases.map(jpegBytes),objs=[];objs.push(ascii('<< /Type /Catalog /Pages 2 0 R >>'));objs.push(ascii('<< /Type /Pages /Kids [3 0 R 6 0 R] /Count 2 >>'));objs.push(ascii('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));objs.push(concatBytes([ascii(`<< /Type /XObject /Subtype /Image /Width 1080 /Height 1080 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[0].length} >>\nstream\n`),imgs[0],ascii('\nendstream')]));let c1=ascii('q 612 0 0 612 0 0 cm /Im0 Do Q');objs.push(concatBytes([ascii(`<< /Length ${c1.length} >>\nstream\n`),c1,ascii('\nendstream')]));objs.push(ascii('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 612] /Resources << /XObject << /Im1 7 0 R >> >> /Contents 8 0 R >>'));objs.push(concatBytes([ascii(`<< /Type /XObject /Subtype /Image /Width 1080 /Height 1080 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[1].length} >>\nstream\n`),imgs[1],ascii('\nendstream')]));let c2=ascii('q 612 0 0 612 0 0 cm /Im1 Do Q');objs.push(concatBytes([ascii(`<< /Length ${c2.length} >>\nstream\n`),c2,ascii('\nendstream')]));const head=ascii('%PDF-1.4\n'),parts=[head],offs=[0];let pos=head.length;objs.forEach((o,i)=>{offs.push(pos);const pre=ascii(`${i+1} 0 obj\n`),post=ascii('\nendobj\n');parts.push(pre,o,post);pos+=pre.length+o.length+post.length});const xref=pos;let table=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offs.length;i++)table+=String(offs[i]).padStart(10,'0')+' 00000 n \n';table+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;parts.push(ascii(table));return new Blob([concatBytes(parts)],{type:'application/pdf'})}
async function downloadPostPdf(c,p){toast('Gerando PDF…');triggerDownload(pdfFromCanvases(exportSlides(c,p)),`ssc-2026-recomendacao-${c.id}.pdf`)}
'''
          if 'function openPostMenu(id)' not in s:
              marker = 'function openStories(section)'
              if marker not in s: raise SystemExit('helper insertion marker not found')
              s = s.replace(marker, helpers + marker, 1)

          bottom_marker = "$ ('postMenu')"
          if "$('postMenu').onclick" not in s:
              marker = "$('homeBtn').onclick=()=>"
              if marker not in s: raise SystemExit('bottom marker not found')
              s = s.replace(marker, "$('postMenu').onclick=e=>{if(e.target===$('postMenu'))closePostMenu()};" + marker, 1)

          home.write_text(s)

          post_page = r'''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Publicação — Studygram SSC 2026</title><style>
:root{--bg:#fff;--ink:#000;--muted:#737373;--line:#dbdbdb;--soft:#fafafa;--blue:#0095f6;--accent:#0f766e;--accent2:#134e4a}@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f5;--muted:#aaa;--line:#262626;--soft:#101010}}*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;background:var(--bg)}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}.bar{height:55px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px)}.bar-inner{width:min(620px,100%);height:100%;margin:auto;padding:0 14px;display:flex;align-items:center;gap:14px}.back{font-size:28px}.bar-title{font-weight:700;flex:1}.shell{width:min(620px,100%);margin:0 auto;padding:18px 0 70px}.post{border:1px solid var(--line);border-radius:10px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px}.avatar{width:42px;height:42px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}.avatar img{width:100%;height:100%;display:block;border-radius:50%;border:2px solid var(--bg)}.user{flex:1}.user b{display:block;font-size:14px}.user span{font-size:12px;color:var(--muted)}.more{border:0;background:none;font-size:21px;padding:8px}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1}.carousel::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;padding:30px;display:flex;flex-direction:column}.cover{color:#fff;justify-content:space-between;background:linear-gradient(145deg,var(--accent),var(--accent2))}.cover small{font-weight:800;text-transform:uppercase;letter-spacing:.08em}.cover h1{font-size:clamp(30px,7vw,46px);line-height:1.03;margin:0}.answer{background:var(--bg);overflow:auto}.answer small{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.answer-body{font-size:clamp(17px,4vw,22px);line-height:1.42;margin-top:18px}.answer-meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto;padding-top:18px}.dots{text-align:center;padding:8px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin:0 2px}.dot.active{background:var(--blue)}.actions{padding:10px 14px;display:flex;gap:12px}.action{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:9px;font-weight:600;cursor:pointer}.sources{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:18px}.sources h2{font-size:17px;margin:0 0 6px}.sources p{font-size:13px;color:var(--muted);line-height:1.45}.source{display:block;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.source b{display:block}.source span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.menu-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px}.menu-bg.open{display:flex}.menu{width:min(420px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}.mi{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 18px;font-size:14px;cursor:pointer}.mi.primary{color:var(--blue);font-weight:700}.mi.cancel{text-align:center;font-weight:700}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262626;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;opacity:0;transition:.2s;z-index:110}.toast.show{opacity:1}.error{text-align:center;padding:80px 20px}.error a{color:var(--blue);font-weight:700}@media(max-width:650px){.shell{padding:0 0 55px}.post,.sources{border-left:0;border-right:0;border-radius:0}.sources{margin-top:10px}.menu-bg{align-items:flex-end;padding:0}.menu{width:100%;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style></head><body><header class="bar"><div class="bar-inner"><a class="back" href="../">‹</a><div class="bar-title">Publicação</div></div></header><main class="shell" id="shell"><div id="loading" class="error">Carregando publicação…</div></main><div class="menu-bg" id="menuBg"><section class="menu" id="menu"></section></div><div class="toast" id="toast"></div><script>
const PROFILES={"Rastreio e manejo inicial":{"username":"rastreio.sepse","name":"Rastreio & Manejo Inicial","accent":"#f59e0b","accent2":"#ef4444","icon":"◎"},"Infecção e antimicrobianos":{"username":"antimicrobianos.sepse","name":"Antimicrobianos","accent":"#8b5cf6","accent2":"#ec4899","icon":"◫"},"Hemodinâmica":{"username":"hemodinamica.sepse","name":"Hemodinâmica","accent":"#ef4444","accent2":"#f97316","icon":"♥"},"Suporte respiratório":{"username":"respiratorio.sepse","name":"Suporte Respiratório","accent":"#06b6d4","accent2":"#3b82f6","icon":"♧"},"Terapias adjuvantes":{"username":"adjuvantes.sepse","name":"Terapias Adjuvantes","accent":"#10b981","accent2":"#14b8a6","icon":"✚"},"Objetivos de cuidado":{"username":"objetivos.sepse","name":"Objetivos de Cuidado","accent":"#6366f1","accent2":"#8b5cf6","icon":"◇"},"Transições de cuidado":{"username":"transicoes.sepse","name":"Transições de Cuidado","accent":"#f43f5e","accent2":"#a855f7","icon":"↔"},"Recuperação":{"username":"recuperacao.sepse","name":"Recuperação Pós-Sepse","accent":"#22c55e","accent2":"#eab308","icon":"☀"}},SOURCE_CCM='https://doi.org/10.1097/CCM.0000000000007075',SOURCE_ICM='https://doi.org/10.1007/s00134-026-08361-1',$=id=>document.getElementById(id);let CARD=null,PROFILE=null;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function rich(s=''){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function plain(s=''){return String(s||'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim()}function profileHref(){return `../${encodeURIComponent(PROFILE.username)}`}function avatar(p){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g"><stop stop-color="${p.accent}"/><stop offset="1" stop-color="${p.accent2}"/></linearGradient></defs><circle cx="64" cy="64" r="64" fill="url(#g)"/><text x="64" y="79" text-anchor="middle" font-size="58" fill="white" font-family="Arial">${p.icon}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function meta(c){return [c.f&&`<b>Força/certeza:</b> ${rich(c.f)}`,c.y&&`<b>Tipo:</b> ${rich(c.y)}`,c.o&&`<b>Observação:</b> ${rich(c.o)}`].filter(Boolean).join('<br><br>')}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1700)}function render(){document.documentElement.style.setProperty('--accent',PROFILE.accent);document.documentElement.style.setProperty('--accent2',PROFILE.accent2);document.title=`Recomendação ${CARD.id} — ${PROFILE.username}`;$('shell').innerHTML=`<article class="post"><div class="post-head"><a class="avatar" href="${profileHref()}"><img src="${avatar(PROFILE)}" alt="${esc(PROFILE.name)}"></a><div class="user"><a href="${profileHref()}"><b>${esc(PROFILE.username)}</b></a><span>${esc(PROFILE.name)} · recomendação ${CARD.id}/129</span></div><button class="more" id="more">•••</button></div><div class="carousel" id="carousel"><section class="slide cover"><small>${esc(PROFILE.name)} · recomendação ${CARD.id}</small><h1>${esc(CARD.t)}</h1><small>PDF · p. ${CARD.p} · deslize →</small></section><section class="slide answer"><small>Recomendação ${CARD.id}</small><div class="answer-body">${rich(CARD.a)}</div><div class="answer-meta">${meta(CARD)}</div></section></div><div class="dots"><span class="dot active"></span><span class="dot"></span></div><div class="actions"><button class="action" id="share">Compartilhar</button><button class="action" id="download">Baixar</button></div></article><section class="sources" id="sources"><h2>Referências e fonte</h2><p>Conteúdo educacional baseado na Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2026. Nesta tradução, esta recomendação corresponde à página ${CARD.p} do PDF utilizado.</p><a class="source" href="${SOURCE_CCM}" target="_blank" rel="noopener"><