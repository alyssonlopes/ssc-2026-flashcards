name: Sync flashcard data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy flashcard data
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL "https://raw.githubusercontent.com/alyssonlopes/contador/sepsis-flashcards/cards-${i}.json" -o "cards-${i}.json"
          done
      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards-*.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add SSC 2026 flashcard data"
            git push
          fi
